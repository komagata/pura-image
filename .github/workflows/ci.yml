name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rake test
      - name: Run RuboCop
        run: bundle exec rubocop lib/ test/

  test-yjit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby with YJIT
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install dependencies
        run: bundle install
      - name: Run tests with YJIT
        run: RUBY_YJIT_ENABLE=1 bundle exec rake test

  active-storage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rails-version: ['~> 7.2.0', '~> 8.0.0', '~> 8.1.0']
        eager-load: ['0', '1']
    env:
      RAILS_VERSION: ${{ matrix.rails-version }}
      EAGER_LOAD: ${{ matrix.eager-load }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: bundle install
      - run: bundle exec ruby -Ilib test/integration/active_storage.rb pura
      - run: bundle exec ruby -Ilib test/integration/active_storage.rb disabled
